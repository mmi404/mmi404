spring:
  application:
    name: portfolio
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # No fallback here on purpose: this repo is public, so a default secret baked into
    # the base config would be a readable-forever admin-JWT-forging key in git history.
    # JWT_SECRET must be set via a real env var in any non-dev environment — if it's
    # missing, startup must fail loudly (placeholder resolution error), not silently
    # sign tokens with a known secret. The dev-only value lives in application-dev.yml.
    # Must be at least 32 bytes (256 bits) for HS256.
    secret: ${JWT_SECRET}
    expiration-minutes: 120
    cookie-name: ACCESS_TOKEN
  security:
    # Cookie gets the Secure flag by default (HTTPS only) — relaxed in application-dev.yml
    # since local dev runs over plain HTTP.
    cookie-secure: true
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    max-size-bytes: 5242880
